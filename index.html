<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 - Ultimate Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theme Management */
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: #1a1a1a;
            --board-bg: #2a2a2a;
            --text-color: #ffffff;
            --accent-color: #00ff88;
            --player1-color: #ff4757;
            --player2-color: #3742fa;
            --bot-color: #ffa502;
            --shadow: rgba(0, 0, 0, 0.5);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        [data-theme="light"] {
            --primary-bg: #f8f9fa;
            --secondary-bg: #e9ecef;
            --board-bg: #ffffff;
            --text-color: #212529;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--player1-color), var(--player2-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .theme-toggle, .join-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .theme-toggle:hover, .join-btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        /* Game Container */
        .game-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            align-items: start;
        }

        /* Game Board */
        .game-board {
            background: var(--board-bg);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: 0 10px 30px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin: 2rem auto;
            max-width: 560px;
            perspective: 1000px;
        }

        .cell {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            border: 2px solid transparent;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        .cell.player1 {
            background: var(--player1-color);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
            animation: dropPiece 0.5s ease-out;
        }

        .cell.player2 {
            background: var(--player2-color);
            box-shadow: 0 0 20px rgba(55, 66, 250, 0.5);
            animation: dropPiece 0.5s ease-out;
        }

        .cell.bot {
            background: var(--bot-color);
            box-shadow: 0 0 20px rgba(255, 165, 2, 0.5);
            animation: dropPiece 0.5s ease-out;
        }

        .cell.winner {
            animation: winnerPulse 1s infinite;
        }

        .cell.preview {
            background: rgba(255, 255, 255, 0.3);
            opacity: 0.7;
        }

        /* Column Headers */
        .column-header {
            text-align: center;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--accent-color);
            cursor: pointer;
            transition: var(--transition);
            padding: 0.5rem;
            border-radius: var(--border-radius);
        }

        .column-header:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: translateY(-2px);
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .game-info, .scoreboard, .controls {
            background: var(--board-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: 0 5px 15px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .game-info h3, .scoreboard h3, .controls h3 {
            margin-bottom: 1rem;
            color: var(--accent-color);
            font-family: 'Orbitron', monospace;
        }

        .current-player {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            padding: 1rem;
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-item:last-child {
            border-bottom: none;
        }

        .btn {
            background: linear-gradient(45deg, var(--accent-color), #00cc77);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            width: 100%;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #6c757d, #495057);
        }

        .btn-danger {
            background: linear-gradient(45deg, #dc3545, #c82333);
        }

        /* Game Mode Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--board-bg);
            border-radius: var(--border-radius);
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease;
        }

        .modal h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            font-family: 'Orbitron', monospace;
        }

        .game-mode-btn {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
            padding: 1rem;
            font-size: 1rem;
        }

        /* Winner Line */
        .winner-line {
            position: absolute;
            background: var(--accent-color);
            z-index: 10;
            border-radius: 4px;
            animation: drawLine 0.5s ease-out;
        }

        /* Bot Thinking Indicator */
        .bot-thinking {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 165, 2, 0.1);
            border-radius: var(--border-radius);
            margin: 1rem 0;
            display: none;
        }

        .bot-thinking.show {
            display: block;
            animation: pulse 1s infinite;
        }

        .thinking-dots::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        /* Color Customization */
        .color-picker {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .color-option:hover, .color-option.active {
            border-color: var(--accent-color);
            transform: scale(1.1);
        }

        /* Animations */
        @keyframes dropPiece {
            0% {
                transform: translateY(-100px) rotateX(180deg);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(0) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes winnerPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px currentColor;
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 40px currentColor;
            }
        }

        @keyframes drawLine {
            0% {
                width: 0;
                height: 0;
            }
            100% {
                width: var(--line-width);
                height: var(--line-height);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .game-container {
                grid-template-columns: 1fr;
                gap: 1rem;
                margin: 1rem auto;
            }

            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            .board {
                grid-template-columns: repeat(7, 1fr);
                gap: 4px;
                max-width: 350px;
            }

            .cell {
                width: 45px;
                height: 45px;
            }

            .game-board {
                padding: 1rem;
            }

            .modal-content {
                margin: 1rem;
                padding: 1.5rem;
            }

            .header-controls {
                flex-direction: row;
                justify-content: center;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .cell {
                width: 40px;
                height: 40px;
            }

            .board {
                max-width: 300px;
                gap: 2px;
            }

            .header {
                padding: 0.5rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .theme-toggle, .join-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Winner Celebration */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-color);
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Sound Toggle */
        .sound-toggle {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .sound-toggle:hover {
            background: var(--accent-color);
            color: var(--primary-bg);
        }

        .sound-toggle.muted {
            opacity: 0.5;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Header -->
    <header class="header">
        <div class="logo">CONNECT 4</div>
        <div class="header-controls">
            <button class="sound-toggle" id="soundToggle" title="Toggle Sound">🔊</button>
            <button class="theme-toggle" id="themeToggle">🌙</button>
            <a href="https://www.youtube.com/@promptminds" target="_blank" class="join-btn">Join Channel</a>
        </div>
    </header>

    <!-- Game Container -->
    <div class="game-container">
        <!-- Game Board -->
        <div class="game-board">
            <div class="column-headers" id="columnHeaders">
                <div class="column-header" data-col="0">1</div>
                <div class="column-header" data-col="1">2</div>
                <div class="column-header" data-col="2">3</div>
                <div class="column-header" data-col="3">4</div>
                <div class="column-header" data-col="4">5</div>
                <div class="column-header" data-col="5">6</div>
                <div class="column-header" data-col="6">7</div>
            </div>
            
            <div class="bot-thinking" id="botThinking">
                <div class="loading"></div>
                <span class="thinking-dots">Bot is thinking</span>
            </div>
            
            <div class="board" id="gameBoard"></div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Game Info -->
            <div class="game-info">
                <h3>Game Status</h3>
                <div class="current-player" id="currentPlayer">Player 1's Turn</div>
                <div class="game-mode" id="gameMode">Player vs Player</div>
            </div>

            <!-- Scoreboard -->
            <div class="scoreboard">
                <h3>Scoreboard</h3>
                <div class="score-item">
                    <span>Player 1 Wins:</span>
                    <span id="player1Score">0</span>
                </div>
                <div class="score-item">
                    <span>Player 2 Wins:</span>
                    <span id="player2Score">0</span>
                </div>
                <div class="score-item">
                    <span>Bot Wins:</span>
                    <span id="botScore">0</span>
                </div>
                <div class="score-item">
                    <span>Draws:</span>
                    <span id="drawScore">0</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <h3>Game Controls</h3>
                <button class="btn" id="newGameBtn">New Game</button>
                <button class="btn btn-secondary" id="undoBtn" disabled>Undo Move</button>
                <button class="btn btn-secondary" id="restartBtn">Restart</button>
                <button class="btn btn-danger" id="resetScoreBtn">Reset Scores</button>
                
                <h4 style="margin: 1rem 0 0.5rem; color: var(--accent-color);">Player Colors</h4>
                <div class="color-picker" id="colorPicker">
                    <div class="color-option" style="background: #ff4757;" data-color="#ff4757"></div>
                    <div class="color-option" style="background: #3742fa;" data-color="#3742fa"></div>
                    <div class="color-option" style="background: #2ed573;" data-color="#2ed573"></div>
                    <div class="color-option" style="background: #ffa502;" data-color="#ffa502"></div>
                    <div class="color-option" style="background: #ff6b81;" data-color="#ff6b81"></div>
                    <div class="color-option" style="background: #5352ed;" data-color="#5352ed"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Mode Selection Modal -->
    <div class="modal" id="gameModeModal">
        <div class="modal-content">
            <h2>Select Game Mode</h2>
            <button class="btn game-mode-btn" data-mode="pvp">Player vs Player</button>
            <button class="btn game-mode-btn" data-mode="easy">Player vs Bot (Easy)</button>
            <button class="btn game-mode-btn" data-mode="normal">Player vs Bot (Normal)</button>
            <button class="btn game-mode-btn" data-mode="hard">Player vs Bot (Hard)</button>
        </div>
    </div>

    <!-- Celebration Container -->
    <div class="celebration" id="celebration"></div>

    <script>
        class Connect4Game {
            constructor() {
                this.board = Array(6).fill().map(() => Array(7).fill(0));
                this.currentPlayer = 1;
                this.gameMode = 'pvp';
                this.gameOver = false;
                this.moveHistory = [];
                this.scores = {
                    player1: 0,
                    player2: 0,
                    bot: 0,
                    draws: 0
                };
                this.soundEnabled = true;
                this.colors = {
                    player1: '#ff4757',
                    player2: '#3742fa',
                    bot: '#ffa502'
                };
                
                this.initializeGame();
                this.setupEventListeners();
                this.loadScores();
                this.showGameModeModal();
            }

            initializeGame() {
                this.createBoard();
                this.updateDisplay();
            }

            createBoard() {
                const board = document.getElementById('gameBoard');
                board.innerHTML = '';
                
                // Create column headers with hover effect
                const headers = document.getElementById('columnHeaders');
                headers.style.display = 'grid';
                headers.style.gridTemplateColumns = 'repeat(7, 1fr)';
                headers.style.gap = '8px';
                headers.style.marginBottom = '1rem';
                headers.style.maxWidth = '560px';
                headers.style.margin = '0 auto 1rem';

                // Create board cells
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < 7; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        board.appendChild(cell);
                    }
                }
            }

            setupEventListeners() {
                // Board clicks
                document.getElementById('gameBoard').addEventListener('click', (e) => {
                    if (e.target.classList.contains('cell')) {
                        const col = parseInt(e.target.dataset.col);
                        this.makeMove(col);
                    }
                });

                // Column header clicks
                document.getElementById('columnHeaders').addEventListener('click', (e) => {
                    if (e.target.classList.contains('column-header')) {
                        const col = parseInt(e.target.dataset.col);
                        this.makeMove(col);
                    }
                });

                // Column hover preview
                document.getElementById('columnHeaders').addEventListener('mouseover', (e) => {
                    if (e.target.classList.contains('column-header') && !this.gameOver) {
                        const col = parseInt(e.target.dataset.col);
                        this.showHoverPreview(col);
                    }
                });

                document.getElementById('columnHeaders').addEventListener('mouseout', () => {
                    this.clearHoverPreview();
                });

                // Control buttons
                document.getElementById('newGameBtn').addEventListener('click', () => {
                    this.showGameModeModal();
                });

                document.getElementById('undoBtn').addEventListener('click', () => {
                    this.undoMove();
                });

                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restartGame();
                });

                document.getElementById('resetScoreBtn').addEventListener('click', () => {
                    this.resetScores();
                });

                // Theme toggle
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Sound toggle
                document.getElementById('soundToggle').addEventListener('click', () => {
                    this.toggleSound();
                });

                // Game mode selection
                document.querySelectorAll('.game-mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setGameMode(e.target.dataset.mode);
                        this.hideGameModeModal();
                        this.restartGame();
                    });
                });

                // Color picker
                document.getElementById('colorPicker').addEventListener('click', (e) => {
                    if (e.target.classList.contains('color-option')) {
                        this.changePlayerColor(e.target.dataset.color);
                    }
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver) return;
                    
                    const col = parseInt(e.key) - 1;
                    if (col >= 0 && col <= 6) {
                        this.makeMove(col);
                    } else if (e.key === 'u' || e.key === 'U') {
                        this.undoMove();
                    } else if (e.key === 'r' || e.key === 'R') {
                        this.restartGame();
                    }
                });
            }

            makeMove(col) {
                if (this.gameOver || !this.isValidMove(col)) return;
                if (this.gameMode !== 'pvp' && this.currentPlayer === 2) return;

                const row = this.getLowestRow(col);
                if (row === -1) return;

                // Add move to history
                this.moveHistory.push({ row, col, player: this.currentPlayer });
                
                // Update board
                this.board[row][col] = this.currentPlayer;
                
                // Update display
                this.updateCell(row, col);
                this.playSound('drop');
                
                // Check for win
                if (this.checkWin(row, col)) {
                    this.handleWin();
                    return;
                }
                
                // Check for draw
                if (this.checkDraw()) {
                    this.handleDraw();
                    return;
                }
                
                // Switch player
                this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
                this.updateDisplay();
                
                // Enable undo button
                document.getElementById('undoBtn').disabled = false;
                
                // Bot move
                if (this.gameMode !== 'pvp' && this.currentPlayer === 2) {
                    this.botMove();
                }
            }

            isValidMove(col) {
                return this.board[0][col] === 0;
            }

            getLowestRow(col) {
                for (let row = 5; row >= 0; row--) {
                    if (this.board[row][col] === 0) {
                        return row;
                    }
                }
                return -1;
            }

            updateCell(row, col) {
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                const playerClass = this.gameMode !== 'pvp' && this.currentPlayer === 2 ? 'bot' : `player${this.currentPlayer}`;
                cell.classList.add(playerClass);
                
                // Update CSS custom properties for colors
                if (this.currentPlayer === 1) {
                    cell.style.background = this.colors.player1;
                    cell.style.boxShadow = `0 0 20px ${this.colors.player1}80`;
                } else if (this.gameMode !== 'pvp') {
                    cell.style.background = this.colors.bot;
                    cell.style.boxShadow = `0 0 20px ${this.colors.bot}80`;
                } else {
                    cell.style.background = this.colors.player2;
                    cell.style.boxShadow = `0 0 20px ${this.colors.player2}80`;
                }
            }

            checkWin(row, col) {
                const player = this.board[row][col];
                const directions = [
                    [0, 1], [1, 0], [1, 1], [1, -1]
                ];

                for (let [dr, dc] of directions) {
                    let count = 1;
                    let winCells = [[row, col]];
                    
                    // Check positive direction
                    for (let i = 1; i < 4; i++) {
                        const newRow = row + dr * i;
                        const newCol = col + dc * i;
                        if (newRow >= 0 && newRow < 6 && newCol >= 0 && newCol < 7 && 
                            this.board[newRow][newCol] === player) {
                            count++;
                            winCells.push([newRow, newCol]);
                        } else break;
                    }
                    
                    // Check negative direction
                    for (let i = 1; i < 4; i++) {
                        const newRow = row - dr * i;
                        const newCol = col - dc * i;
                        if (newRow >= 0 && newRow < 6 && newCol >= 0 && newCol < 7 && 
                            this.board[newRow][newCol] === player) {
                            count++;
                            winCells.unshift([newRow, newCol]);
                        } else break;
                    }
                    
                    if (count >= 4) {
                        this.highlightWinningCells(winCells);
                        return true;
                    }
                }
                return false;
            }

            highlightWinningCells(cells) {
                cells.forEach(([row, col]) => {
                    const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                    cell.classList.add('winner');
                });
            }

            checkDraw() {
                return this.board[0].every(cell => cell !== 0);
            }

            handleWin() {
                this.gameOver = true;
                let winner;
                
                if (this.gameMode !== 'pvp' && this.currentPlayer === 2) {
                    winner = 'Bot';
                    this.scores.bot++;
                } else if (this.currentPlayer === 1) {
                    winner = 'Player 1';
                    this.scores.player1++;
                } else {
                    winner = 'Player 2';
                    this.scores.player2++;
                }
                
                document.getElementById('currentPlayer').textContent = `${winner} Wins! 🎉`;
                this.playSound('win');
                this.createCelebration();
                this.saveScores();
                this.updateScoreboard();
            }

            handleDraw() {
                this.gameOver = true;
                this.scores.draws++;
                document.getElementById('currentPlayer').textContent = "It's a Draw! 🤝";
                this.saveScores();
                this.updateScoreboard();
            }

            createCelebration() {
                const celebration = document.getElementById('celebration');
                celebration.innerHTML = '';
                
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = ['#ff4757', '#3742fa', '#00ff88', '#ffa502'][Math.floor(Math.random() * 4)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    celebration.appendChild(confetti);
                }
                
                setTimeout(() => {
                    celebration.innerHTML = '';
                }, 5000);
            }

            botMove() {
                if (this.gameOver) return;
                
                document.getElementById('botThinking').classList.add('show');
                
                setTimeout(() => {
                    document.getElementById('botThinking').classList.remove('show');
                    
                    let col;
                    switch (this.gameMode) {
                        case 'easy':
                            col = this.getRandomMove();
                            break;
                        case 'normal':
                            col = this.getNormalMove();
                            break;
                        case 'hard':
                            col = this.getHardMove();
                            break;
                    }
                    
                    if (col !== -1) {
                        this.makeMove(col);
                    }
                }, Math.random() * 1000 + 500);
            }

            getRandomMove() {
                const validCols = [];
                for (let col = 0; col < 7; col++) {
                    if (this.isValidMove(col)) {
                        validCols.push(col);
                    }
                }
                return validCols.length > 0 ? validCols[Math.floor(Math.random() * validCols.length)] : -1;
            }

            getNormalMove() {
                // Try to win first
                for (let col = 0; col < 7; col++) {
                    if (this.isValidMove(col)) {
                        const row = this.getLowestRow(col);
                        this.board[row][col] = 2;
                        if (this.checkWin(row, col)) {
                            this.board[row][col] = 0;
                            return col;
                        }
                        this.board[row][col] = 0;
                    }
                }
                
                // Block player from winning
                for (let col = 0; col < 7; col++) {
                    if (this.isValidMove(col)) {
                        const row = this.getLowestRow(col);
                        this.board[row][col] = 1;
                        if (this.checkWin(row, col)) {
                            this.board[row][col] = 0;
                            return col;
                        }
                        this.board[row][col] = 0;
                    }
                }
                
                // Otherwise random move
                return this.getRandomMove();
            }

            getHardMove() {
                // Advanced AI using minimax algorithm (simplified)
                let bestCol = -1;
                let bestScore = -Infinity;
                
                for (let col = 0; col < 7; col++) {
                    if (this.isValidMove(col)) {
                        const row = this.getLowestRow(col);
                        this.board[row][col] = 2;
                        
                        let score = this.minimax(3, false, -Infinity, Infinity);
                        
                        this.board[row][col] = 0;
                        
                        if (score > bestScore) {
                            bestScore = score;
                            bestCol = col;
                        }
                    }
                }
                
                return bestCol !== -1 ? bestCol : this.getNormalMove();
            }

            minimax(depth, isMaximizing, alpha, beta) {
                // Simple evaluation for demonstration
                if (depth === 0) {
                    return Math.random() * 20 - 10; // Random evaluation
                }
                
                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (let col = 0; col < 7; col++) {
                        if (this.isValidMove(col)) {
                            const row = this.getLowestRow(col);
                            this.board[row][col] = 2;
                            let eval = this.minimax(depth - 1, false, alpha, beta);
                            this.board[row][col] = 0;
                            maxEval = Math.max(maxEval, eval);
                            alpha = Math.max(alpha, eval);
                            if (beta <= alpha) break;
                        }
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let col = 0; col < 7; col++) {
                        if (this.isValidMove(col)) {
                            const row = this.getLowestRow(col);
                            this.board[row][col] = 1;
                            let eval = this.minimax(depth - 1, true, alpha, beta);
                            this.board[row][col] = 0;
                            minEval = Math.min(minEval, eval);
                            beta = Math.min(beta, eval);
                            if (beta <= alpha) break;
                        }
                    }
                    return minEval;
                }
            }

            undoMove() {
                if (this.moveHistory.length === 0 || this.gameOver) return;
                
                const lastMove = this.moveHistory.pop();
                this.board[lastMove.row][lastMove.col] = 0;
                
                const cell = document.querySelector(`[data-row="${lastMove.row}"][data-col="${lastMove.col}"]`);
                cell.className = 'cell';
                cell.style.background = '';
                cell.style.boxShadow = '';
                
                this.currentPlayer = lastMove.player;
                this.gameOver = false;
                
                // Clear winner highlights
                document.querySelectorAll('.cell.winner').forEach(cell => {
                    cell.classList.remove('winner');
                });
                
                this.updateDisplay();
                
                if (this.moveHistory.length === 0) {
                    document.getElementById('undoBtn').disabled = true;
                }
                
                this.playSound('click');
            }

            restartGame() {
                this.board = Array(6).fill().map(() => Array(7).fill(0));
                this.currentPlayer = 1;
                this.gameOver = false;
                this.moveHistory = [];
                
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.className = 'cell';
                    cell.style.background = '';
                    cell.style.boxShadow = '';
                });
                
                document.getElementById('undoBtn').disabled = true;
                document.getElementById('celebration').innerHTML = '';
                
                this.updateDisplay();
            }

            updateDisplay() {
                const currentPlayerEl = document.getElementById('currentPlayer');
                const gameModeEl = document.getElementById('gameMode');
                
                if (this.gameOver) return;
                
                if (this.gameMode === 'pvp') {
                    currentPlayerEl.textContent = `Player ${this.currentPlayer}'s Turn`;
                    gameModeEl.textContent = 'Player vs Player';
                } else {
                    if (this.currentPlayer === 1) {
                        currentPlayerEl.textContent = "Your Turn";
                    } else {
                        currentPlayerEl.textContent = "Bot's Turn";
                    }
                    gameModeEl.textContent = `Player vs Bot (${this.gameMode.charAt(0).toUpperCase() + this.gameMode.slice(1)})`;
                }
                
                this.updateScoreboard();
            }

            updateScoreboard() {
                document.getElementById('player1Score').textContent = this.scores.player1;
                document.getElementById('player2Score').textContent = this.scores.player2;
                document.getElementById('botScore').textContent = this.scores.bot;
                document.getElementById('drawScore').textContent = this.scores.draws;
            }

            showHoverPreview(col) {
                if (!this.isValidMove(col)) return;
                
                const row = this.getLowestRow(col);
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                cell.classList.add('preview');
            }

            clearHoverPreview() {
                document.querySelectorAll('.cell.preview').forEach(cell => {
                    cell.classList.remove('preview');
                });
            }

            setGameMode(mode) {
                this.gameMode = mode;
            }

            showGameModeModal() {
                document.getElementById('gameModeModal').classList.add('show');
            }

            hideGameModeModal() {
                document.getElementById('gameModeModal').classList.remove('show');
            }

            toggleTheme() {
                const body = document.body;
                const themeToggle = document.getElementById('themeToggle');
                
                if (body.dataset.theme === 'dark') {
                    body.dataset.theme = 'light';
                    themeToggle.textContent = '☀️';
                } else {
                    body.dataset.theme = 'dark';
                    themeToggle.textContent = '🌙';
                }
                
                localStorage.setItem('connect4-theme', body.dataset.theme);
            }

            toggleSound() {
                this.soundEnabled = !this.soundEnabled;
                const soundToggle = document.getElementById('soundToggle');
                
                if (this.soundEnabled) {
                    soundToggle.textContent = '🔊';
                    soundToggle.classList.remove('muted');
                } else {
                    soundToggle.textContent = '🔇';
                    soundToggle.classList.add('muted');
                }
                
                localStorage.setItem('connect4-sound', this.soundEnabled);
            }

            changePlayerColor(color) {
                this.colors.player1 = color;
                document.documentElement.style.setProperty('--player1-color', color);
                
                // Update active color option
                document.querySelectorAll('.color-option').forEach(option => {
                    option.classList.remove('active');
                });
                event.target.classList.add('active');
                
                localStorage.setItem('connect4-player1-color', color);
            }

            playSound(type) {
                if (!this.soundEnabled) return;
                
                // Create audio context for sound effects
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                let frequency, duration;
                switch (type) {
                    case 'drop':
                        frequency = 220;
                        duration = 0.1;
                        break;
                    case 'win':
                        frequency = 440;
                        duration = 0.5;
                        break;
                    case 'click':
                        frequency = 330;
                        duration = 0.05;
                        break;
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }

            saveScores() {
                localStorage.setItem('connect4-scores', JSON.stringify(this.scores));
            }

            loadScores() {
                const saved = localStorage.getItem('connect4-scores');
                if (saved) {
                    this.scores = JSON.parse(saved);
                }
                this.updateScoreboard();
                
                // Load theme
                const savedTheme = localStorage.getItem('connect4-theme');
                if (savedTheme) {
                    document.body.dataset.theme = savedTheme;
                    document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
                }
                
                // Load sound preference
                const savedSound = localStorage.getItem('connect4-sound');
                if (savedSound !== null) {
                    this.soundEnabled = JSON.parse(savedSound);
                    this.toggleSound();
                    this.toggleSound(); // Toggle twice to set correct state
                }
                
                // Load player color
                const savedColor = localStorage.getItem('connect4-player1-color');
                if (savedColor) {
                    this.colors.player1 = savedColor;
                    document.documentElement.style.setProperty('--player1-color', savedColor);
                }
            }

            resetScores() {
                this.scores = { player1: 0, player2: 0, bot: 0, draws: 0 };
                this.saveScores();
                this.updateScoreboard();
            }
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new Connect4Game();
        });

        // Prevent context menu on mobile for better UX
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Add touch support for mobile
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchmove', (e) => {
            // Prevent scrolling when touching the game board
            if (e.target.closest('.game-board')) {
                e.preventDefault();
            }
        });
    </script>
</body>
